packages:
  - 'packages/*'

autoDedupe: true
lockfile:
  includeResolutionSettings: true

catalogMode: prefer

catalog:
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': ^5.0.5
  fast-check: ^4.10.2
  typescript: 7.0.2

allowBuilds:
  esbuild: false

# Sanity-owned packages and their build tooling release often; don't gate them on the default
# minimum release age.
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@tsdown/*'
  - groq-js
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - publint
  - tsdown

# `pnpm update` writes a changeset when it changes a published package's runtime dependencies.
update:
  changeset: true
