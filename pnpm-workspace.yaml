packages:
  - 'packages/*'

autoDedupe: true
lockfile:
  format: v13
  includeResolutionSettings: true

catalogMode: prefer

catalog:
  '@types/node': ^26.6.6
  '@types/picomatch': ^4.0.3
  '@vitest/coverage-v8': ^5.1.1
  fast-check: ^4.11.0
  get-tsconfig: ^4.14.3
  picomatch: ^4.0.7
  typescript: 7.0.2

allowBuilds:
  esbuild: false

# Sanity-owned packages and their build tooling release often; don't gate them on the default
# minimum release age. Exact `name@version` entries are one-off exceptions for releases already
# in the lockfile that are still inside the window.
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@tsdown/*'
  - groq-js
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - publint
  - tsdown
  - webpack@5.112.2

# `pnpm update` writes a changeset when it changes a published package's runtime dependencies.
update:
  changeset: true
