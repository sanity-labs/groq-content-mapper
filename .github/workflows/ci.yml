name: CI

on:
  # Build on pushes branches that have a PR (including drafts)
  pull_request:
  # Build on commits pushed to the default branch
  push:
    branches: [main]

permissions:
  contents: read # for checkout

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm exec oxfmt --check
      - run: pnpm knip --reporter github-actions

  # wasm/ is committed; this checks that it is the build of rust/ as it is.
  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/groq-content-mapper
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
        working-directory: packages/groq-content-mapper/rust
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: cargo test
        working-directory: packages/groq-content-mapper/rust
      - run: ./scripts/build-wasm.sh
      - run: git diff --exit-code -- wasm
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: packages/groq-content-mapper/wasm/

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [node@lts]
        include:
          - os: ubuntu-latest
            runtime: node@latest
    steps:
      - name: Set git to use LF
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          runtime: ${{ matrix.runtime }}
      - run: pnpm test
